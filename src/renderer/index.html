<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      技术方案 §2.2。用 meta 而非 main 进程下发响应头：响应头是 session 级的，
      会把 script-src 'self' 一并施加到 epub.js 的书籍 iframe 上，与 frame-src /
      img-src 需要放宽的场景自相矛盾。meta 的作用域恰好只覆盖本页面。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app: data:; frame-src 'self' app: blob:; connect-src 'self' app:; object-src 'none'; base-uri 'none'"
    />
    <title>马克阅读器</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
