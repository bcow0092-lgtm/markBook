name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    # 本项目是 Windows 桌面应用，Linux runner 验证不了打包与路径行为
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 技术方案 §6.5 原写 Node 20，但 Node 20 已于 2026-04 EOL；
          # 且本机开发环境是 24，CI 与本地对齐可避免"本地过、CI 挂"
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  package:
    # 只手动触发：打包要下载 electron / nsis / 7zip 等一堆工具，耗时几分钟，
    # 日常 PR 与 push 不该跑它（§6.5 的档位表）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: mark-reader-windows
          # 只要安装包与免安装版，不要 100MB 的 win-unpacked 中间产物
          path: |
            release/*.exe
          if-no-files-found: error

  e2e-p0:
    # P0 两条在 push 到 main 时跑（§6.5）。PR 不跑 —— Windows runner 按 2 倍
    # 计费，而 E2E 每次要起 Electron，放 PR 上会明显拖慢反馈
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # test:e2e 自带 npm run build —— 本地与 CI 共用同一入口，行为一致
      - run: npm run test:e2e -- tests/e2e/p0.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-p0-report
          path: test-results/
          if-no-files-found: ignore

  e2e-all:
    # 全部 5 条场景只在手动档跑（§6.5）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-all-report
          path: test-results/
          if-no-files-found: ignore
