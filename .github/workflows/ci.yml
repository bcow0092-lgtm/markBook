name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    # 本项目是 Windows 桌面应用，Linux runner 验证不了打包与路径行为
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 技术方案 §6.5 原写 Node 20，但 Node 20 已于 2026-04 EOL；
          # 且本机开发环境是 24，CI 与本地对齐可避免"本地过、CI 挂"
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  # E2E（§6.3 的 P0 两条）与打包产物验证待 M3 有可测主链路后再接
